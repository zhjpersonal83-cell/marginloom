# Included in Ubuntu Nginx's http context via sites-enabled.
limit_req_zone $binary_remote_addr zone=marginloom_api:1m rate=5r/s;
server {
    listen 80;
    server_name __DOMAIN__;
    client_max_body_size 900000;
    client_body_timeout 15s;

    # HTTP serves only ACME validation until enable-https.sh installs the TLS host.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/marginloom-acme;
    }
    location / { return 503; }
}
