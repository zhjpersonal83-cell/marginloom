limit_req_zone $binary_remote_addr zone=marginloom_api:1m rate=5r/s;
server {
    listen 80;
    server_name __DOMAIN__;
    location ^~ /.well-known/acme-challenge/ { root /var/www/marginloom-acme; }
    location / { return 301 https://__DOMAIN__$request_uri; }
}
server {
    listen 443 ssl;
    server_name __DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 900000;
    client_body_timeout 15s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    gzip on;
    gzip_types application/json text/javascript application/javascript text/css image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
    location /api/ {
        limit_req zone=marginloom_api burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
}
