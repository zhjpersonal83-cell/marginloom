name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the command or UI flow and a minimal synthetic input. Never include secrets or private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version, browser and operating system
